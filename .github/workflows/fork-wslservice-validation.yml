name: Fork WSL service validation

on:
  workflow_dispatch:
  push:
    branches:
      - "copilot/fork-validate-loopback-endpoint"

concurrency:
  group: fork-wslservice-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wslservice:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Fetch tags and master from upstream
        shell: pwsh
        run: |
          git remote add upstream https://github.com/microsoft/WSL.git 2>$null
          git fetch --force --tags upstream
          git fetch --force upstream master:refs/remotes/origin/master

      - name: Verify Windows SDK 26100 is installed
        shell: pwsh
        run: |
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\Lib'
          $sdkVersion = '10.0.26100.0'
          $sdkPath = Join-Path $sdkRoot $sdkVersion

          if (-not (Test-Path $sdkPath)) {
            Write-Host 'Installed Windows SDK versions:'
            if (Test-Path $sdkRoot) {
              Get-ChildItem $sdkRoot -Name | Sort-Object
            }
            throw "Required Windows SDK $sdkVersion is not installed on this runner."
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '.',
            '--fresh',
            '-A', 'x64',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_SYSTEM_VERSION=10.0.26100.0',
            '-DSKIP_PACKAGE_SIGNING=TRUE',
            '-DOFFICIAL_BUILD=FALSE',
            '-DINCLUDE_PACKAGE_STAGE=FALSE'
          )

          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & cmake @cmakeArgs
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "CMake configure failed after $maxAttempts attempts."
            }

            Write-Host "CMake configure attempt $attempt failed. Retrying in 20 seconds..."
            Start-Sleep -Seconds 20
          }

      - name: Build wslservice
        shell: pwsh
        run: cmake --build . --config Release --target wslservice --parallel

      - name: Upload CMake logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-wslservice-validation-logs
          path: |
            CMakeCache.txt
            CMakeFiles/CMakeOutput.log
            CMakeFiles/CMakeError.log
